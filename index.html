<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
body{margin:0;min-height:100vh;background:#F5F1E9;color:#4A3F36;font-family:-apple-system,BlinkMacSystemFont,"SF Pro TC","PingFang HK",sans-serif;padding:0 0 40px;overflow-x:clip}
.blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.28;pointer-events:none;z-index:0}
.blob1{width:300px;height:300px;background:#E8C5A8;top:-80px;left:-60px}
.blob2{width:240px;height:240px;background:#D9B89C;top:200px;right:-60px;opacity:.22}
.wrap{position:relative;z-index:1;width:100%;max-width:100%;overflow-x:clip;padding:0 16px}
.header{position:sticky;top:0;z-index:10;background:rgba(245,241,233,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:flex-start;padding:18px 16px 12px;margin:0 -16px 10px;border-bottom:1px solid rgba(237,224,210,.5);width:calc(100% + 32px)}
.h1{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1.1}.h1 small{display:block;font-size:11px;font-weight:700;color:#C97A5A;letter-spacing:2px;margin-top:4px}
.sub{color:#8B7E74;font-size:12.5px;margin-top:8px;line-height:1.5;max-width:260px}
.illust{width:72px;height:72px;background:transparent;border-radius:22px;display:grid;place-items:center;flex-shrink:0}
.illust img{width:72px;height:72px;border-radius:18px;box-shadow:0 6px 18px rgba(74,63,54,.14)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px;width:100%}
.stat{background:rgba(255,255,255,.9);border:1px solid #EDE0D2;border-radius:18px;padding:14px;min-width:0}
.stat b{font-size:20px;display:block} .stat i{font-style:normal;font-size:11px;color:#A99E94}
.form{background:#FFF;border:1px solid #EDE0D2;border-radius:22px;padding:16px;width:100%;max-width:100%;overflow:hidden}
.form-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:700;font-size:13px;color:#6B5E53} .dot{width:7px;height:7px;border-radius:50%;background:#C97A5A}
.input{width:100%;min-width:0;background:#F9F6F1;border:1.5px solid #E8DDD0;border-radius:12px;padding:12px;color:#4A3F36;font-size:15px;outline:none}
.input:focus{border-color:#C97A5A;background:#FFF}
.btn{width:100%;margin-top:12px;background:#C97A5A;color:#FFF;font-weight:700;border:0;border-radius:12px;padding:14px;font-size:15px}
.list{margin-top:18px;display:flex;flex-direction:column;gap:12px;width:100%}
.item{background:#FFF;border:1px solid #EDE0D2;border-radius:18px;padding:14px;width:100%;max-width:100%;overflow:hidden}
.it-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.it-name{font-weight:800;font-size:14px;flex:1;min-width:0;word-break:break-all}
.price{background:#F9EDE5;color:#C97A5A;padding:3px 9px;border-radius:99px;font-weight:800;font-size:12px;border:1px solid #F0D6C8;flex-shrink:0}
.reason{color:#8B7E74;font-size:12px;margin:8px 0 10px;line-height:1.5;background:#FDFBF8;padding:8px 10px;border-radius:8px;border:1px dashed #F0E0D0;word-break:break-all}
.progress{height:5px;background:#F0E9DF;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#E8A082,#C97A5A);transition:width 1s linear}
.meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#B8AEA3;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:600;background:#F9EDE5;color:#C97A5A;border:1px solid #F0D6C8}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap} .sbtn{flex:1;min-width:60px;border-radius:10px;border:1px solid #E8DDD0;background:#F9F6F1;color:#6B5E53;padding:8px;font-size:12px;font-weight:600} .sbtn.primary{background:#C97A5A;color:#FFF;border-color:#C97A5A}
.icon-btns{display:flex;gap:6px} .icon-btn{width:30px;height:30px;border-radius:99px;border:1px solid #EDE0D2;background:#FFF;display:grid;place-items:center;font-size:13px}

<script>
const KEY='impulse_cooler_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"items":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('last').textContent='最後儲存: '+new Date().toLocaleTimeString();}
setInterval(save,300);
window.fillReason=t=>{document.getElementById('reason').value=t;};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
let els={};let editId=null;
window.delItem=(id)=>{if(!confirm('確定刪除？'))return;data.items=data.items.filter(x=>x.id!==id);delete els[id];save();render();};
window.editItem=(id)=>{const it=data.items.find(x=>x.id===id);if(!it)return;$('name').value=it.name;$('price').value=it.price;$('reason').value=it.reason;editId=id;$('add').textContent='✓ 儲存修改';document.querySelector('.form').scrollIntoView({behavior:'smooth'});};
function render(){
 const list=$('list');
 const cur=new Set(data.items.map(i=>i.id));
 const ex=new Set(Object.keys(els));
 let needFull=cur.size!==ex.size||[...cur].some(id=>!ex.has(id))||[...ex].some(id=>!cur.has(id));
 if(!needFull){for(let id in els){const it=data.items.find(x=>x.id===id);if(!it||els[id].status!==it.status){needFull=true;break;}}}
 if(!needFull && list.children.length>0){updateTimers();return;}
 list.innerHTML='';els={};
 if(!data.items.length){list.innerHTML='<div class="empty">🧺<br>未有記錄<br><span style="font-size:11px">見到想買嘅嘢先入嚟寫低</span></div>';}
 data.items.sort((a,b)=>b.createdAt-a.createdAt);
 let saved=0;
 data.items.forEach(it=>{if(it.status==='abandoned')saved+=Number(it.price||0);
  const d=document.createElement('div');d.className='item';
  d.innerHTML=`<div class="it-top"><span class="it-name">${esc(it.name)}</span><div style="display:flex;align-items:center;gap:6px"><span class="price">$${esc(it.price)}</span><div class="icon-btns"><button class="icon-btn" onclick="editItem('${esc(it.id)}')">✏️</button><button class="icon-btn" onclick="delItem('${esc(it.id)}')">🗑️</button></div></div></div><div class="reason">${esc(it.reason||'未寫原因')}</div><div class="progress"><div class="bar"></div></div><div class="meta"><span>${new Date(it.createdAt).toLocaleString()}</span><span class="badge-wrap"></span></div><div class="actions-wrap"></div>`;
  list.appendChild(d);
  els[it.id]={bar:d.querySelector('.bar'),badgeWrap:d.querySelector('.badge-wrap'),actionsWrap:d.querySelector('.actions-wrap'),status:it.status};
 });
 $('count').textContent=data.items.length+' 件'; $('saved').textContent='$'+saved; updateTimers();
}
function updateTimers(){
 for(let id in els){const it=data.items.find(x=>x.id===id);if(!it)continue;const o=els[id];const remain=Math.max(0,it.decideAt-Date.now()),total=86400000;const prog=(it.status==='cooling'||it.status==='extended')?Math.max(0,Math.min(100,100-(remain/total)*100)):100;if(o.bar)o.bar.style.width=prog+'%';const hh=Math.floor(remain/3600000),mm=Math.floor((remain%3600000)/60000),ss=Math.floor((remain%60000)/1000);let b='';if(it.status==='cooling')b=`冷卻中 ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;else if(it.status==='extended')b=`延長中 ${hh}:${mm}:${ss}`;else if(it.status==='decidable')b='✨ 可決定';else if(it.status==='abandoned')b='💚 已放棄';else if(it.status==='bought')b='🛒 已購買';if(o.badgeWrap)o.badgeWrap.innerHTML=`<span class="badge">${b}</span>`;if((it.status==='decidable'||it.status==='extended')&&o.actionsWrap&&!o.actionsWrap.hasChildNodes()){const ac=document.createElement('div');ac.className='actions';const b1=document.createElement('button');b1.className='sbtn';b1.textContent='放棄';b1.onclick=()=>act(it.id,'abandoned');const b2=document.createElement('button');b2.className='sbtn';b2.textContent='再諗24H';b2.onclick=()=>act(it.id,'extended');const b3=document.createElement('button');b3.className='sbtn primary';b3.textContent='已買';b3.onclick=()=>act(it.id,'bought');ac.append(b1,b2,b3);o.actionsWrap.appendChild(ac);}else if(!(it.status==='decidable'||it.status==='extended')&&o.actionsWrap){o.actionsWrap.innerHTML='';}}
}
